# Your own standing decisions. The skill treats everything here as a hard constraint or
# a goal it must try to hit — it never invents or overrides these values itself.
# Copy this file to data/preferences.yaml and fill in your real preferences.

# Optional: the window each day that's available for scheduling at all.
day_start: "07:30"
day_end: "23:30"

# Time blocks that must NEVER be scheduled over, no matter how tight the week gets.
# This is how you decide "which evenings I want to keep."
protected_blocks:
  - label: "週五晚上放空"
    days: [fri]
    start: "19:00"
    end: "23:00"
  - label: "週日早上慢慢來"
    days: [sun]
    start: "08:00"
    end: "10:30"

# Recurring personal activities you want the plan to actively protect time for.
# This is how you decide "how many times a week I want to exercise" etc. — the skill
# will try to place these before it lets optional tasks take the same slots, and will
# tell you if it can't fit the full count.
weekly_targets:
  - activity: "運動"
    times_per_week: 3
    session_minutes: 45
    time_preference: morning
    location_options: ["健身房", "家裡"]
  - activity: "閱讀"
    times_per_week: 2
    session_minutes: 30
    time_preference: evening
    location_options: ["anywhere"]
  - activity: "朋友社交"
    times_per_week: 1
    session_minutes: 120
    time_preference: evening
    location_options: ["anywhere"]

# When the week is overbooked and something has to give, this is the order you're willing
# to sacrifice things in (top = cut first). The skill uses this only as a last resort and
# will always tell you when it had to fall back on it — it never cuts silently.
sacrifice_priority:
  - "optional 任務"
  - "閱讀"
  - "朋友社交"
  - "運動"
  # must 任務與 protected_blocks 永遠不在這個清單裡 — 這兩者不可犧牲
